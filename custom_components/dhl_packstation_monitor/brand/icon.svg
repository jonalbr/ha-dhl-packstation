<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">DHL Packstation Monitor</title>
  <desc id="description">The DHL wordmark above a red parcel locker on yellow, with a clear magnifying-glass outline representing Packstation insights.</desc>
  <rect id="background" width="512" height="512" rx="56" fill="#ffcc00"/>
  <!-- DHL wordmark: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/dhl.svg -->
  <svg id="dhl-wordmark" x="80" y="48" width="352" height="50" viewBox="0 220 512 73">
    <path fill="#d40511" d="M0 286.5h62l-3.6 5H0zm511.6 5h-75.9l3.9-5H512v5zM0 277.2h69.2l-3.9 5H0zm0-9.3h76.3l-3.9 5H0zm511.6 14.3h-68.8l3.9-5H512v5zm-58.1-14.3h58.1v5h-62zM67 291.5l32.8-43.9h40.6c4.6 0 4.6 1.8 2.1 4.6-2.1 2.9-6.1 8.2-8.2 11.1-1.1 1.8-3.2 4.3 3.6 4.3h54.6c-4.3 6.4-19.3 24.2-45.6 24.2-21.4-.3-79.9-.3-79.9-.3m187.9-23.6-17.8 23.9h-46.7l17.8-23.9zm68.1 0-17.8 23.9h-47.1l17.8-23.9zm15.4 0s-3.6 4.6-5 6.8c-6.1 7.8-.7 17.1 18.5 17.1h75.6l17.8-23.9zM90.2 220.5l-16.4 21.7h89.1c4.6 0 4.6 1.8 2.1 4.6-2.1 2.9-6.1 8.2-8.2 11.1-1.1 1.4-3.2 4.3 3.6 4.3h36.4s6.1-7.8 10.7-14.6c6.8-8.9.7-27.5-23.2-27.5-21.4.4-94.1.4-94.1.4M327 262.2H212.1l31.4-41.7h47.1l-17.8 23.9h21l17.8-23.9h47.1zm96.6-41.7-31.4 41.7h-49.9l31.4-41.7z"/>
  </svg>
  <g id="locker" fill="#d40511">
    <rect id="roof" x="48" y="116" width="416" height="34" rx="17"/>
    <g id="left-compartments">
      <path d="M66 166h154v62H66zM66 240h71v54H66zM149 240h71v54h-71zM66 306h71v32H66zM149 306h71v32h-71zM66 350h71v32H66zM149 350h71v32h-71z"/>
    </g>
    <g id="terminal">
      <path d="M232 166h48v216h-48z"/>
      <rect x="242" y="180" width="28" height="52" rx="2" fill="#ffcc00"/>
    </g>
    <g id="right-compartments">
      <path d="M292 166h154v62H292zM292 240h71v54h-71zM375 240h71v54h-71zM292 306h71v32h-71zM375 306h71v32h-71zM292 350h71v32h-71zM375 350h71v32h-71z"/>
    </g>
  </g>
  <!-- Only the outline overlays the locker; the compartments stay at their original scale. -->
  <g id="magnifying-glass" fill="none" stroke-linecap="round">
    <path d="M408 392l40 40" stroke="#ffcc00" stroke-width="38"/>
    <circle cx="352" cy="336" r="64" stroke="#ffcc00" stroke-width="32"/>
    <path d="M408 392l40 40" stroke="#d40511" stroke-width="24"/>
    <circle cx="352" cy="336" r="64" stroke="#d40511" stroke-width="18"/>
  </g>
</svg>
