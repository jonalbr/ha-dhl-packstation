name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest --ignore=tests/ha
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python scripts/build_brand.py --check
      - run: uv run python scripts/check_release.py
      - run: uv run python scripts/build_release.py
  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
          enable-cache: true
      - run: uv sync --locked --group ha-test
      - run: >-
          uv run --locked --group ha-test pytest tests
          --disable-socket --allow-unix-socket
          --cov=custom_components/dhl_packstation_monitor
          --cov-branch --cov-report=term-missing --cov-fail-under=100
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: hacs/action@main
        with:
          category: integration
          comment: false
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: home-assistant/actions/hassfest@master

