[project]
name = "ha-dhl-packstation"
version = "0.3.0"
description = "DHL Packstation compartment availability for Home Assistant"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
  "pytest==9.0.3",
  "pytest-asyncio==1.4.0",
  "aiohttp==3.14.5",
  "ruff==0.17.5",
  "resvg-py==0.5.0",
]
# Keep portable pytest compatible with the pinned HA test plugin.
ha-test = [
  "homeassistant==2026.11.2; sys_platform == 'linux'",
  "pytest-homeassistant==2026.11.2; sys_platform == 'linux'",
  "pytest-cov==7.1.0; sys_platform == 'linux'",
]
smoke = [
  "home-assistant-frontend==20261028.6; sys_platform == 'linux'",
  "gazetteer-matcher==1.1.0; sys_platform == 'linux'",
  "hassil==3.12.1; sys_platform == 'linux'",
  "home-assistant-intents==2026.10.27; sys_platform == 'linux'",
  "mutagen==1.48.1; sys_platform == 'linux'",
  "PyTurboJPEG==1.8.3; sys_platform == 'linux'",
  "ha-ffmpeg==3.2.2; sys_platform == 'linux'",
  "av==19.0.0; sys_platform == 'linux'",
  "numpy==2.3.2; sys_platform == 'linux'",
  "pymicro-vad==1.0.1; sys_platform == 'linux'",
  "pyspeex-noise==1.0.2; sys_platform == 'linux'",
  "playwright==1.65.2; sys_platform == 'linux'",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Let Home Assistant install its httpx alias before respx is imported.
addopts = "-p no:respx"

[tool.ruff]
# Use Ruff's default lint rules and formatter settings.
